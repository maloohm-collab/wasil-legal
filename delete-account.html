<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حذف الحساب والبيانات — WASIL</title>
<style>
  :root{
    --navy:#0D1F6E;
    --blue:#1677FF;
    --bg:#F5F7FA;
    --muted:#64748B;
    --border:#E5E7EB;
    --text:#1A2233;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    line-height:1.75;
  }
  header{
    background:linear-gradient(135deg, var(--navy), var(--blue));
    color:#fff;
    padding:40px 20px 32px;
    text-align:center;
  }
  header .logo{
    width:52px;height:52px;border-radius:14px;
    background:rgba(255,255,255,.15);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:22px;margin:0 auto 14px;
  }
  header h1{margin:0;font-size:22px;font-weight:700;}
  header p{margin:8px 0 0;opacity:.85;font-size:14px;}
  main{max-width:640px;margin:0 auto;padding:28px 20px 60px;}
  .card{
    background:#fff;border:1px solid var(--border);
    border-radius:14px;padding:22px 20px;margin-bottom:18px;
  }
  .card h2{
    font-size:17px;color:var(--navy);margin:0 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .card p, .card li{font-size:14.5px;color:var(--text);}
